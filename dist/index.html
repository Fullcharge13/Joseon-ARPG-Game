<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c10">
<title>조선퇴마록 외전: 백귀사</title>
<style>
:root{--bg:#120c10;--panel:#1e1618;--panel2:#2a1f20;--line:#5a4232;--ink:#efe6d2;--dim:#a89a86;--gold:#e0b048;--red:#c23b2a;
--r0:#d8d0bc;--r1:#6fa8ff;--r2:#ffd451;--r3:#ff8a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:none;pointer-events:auto;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.scr.on{display:flex}
.dim{background:rgba(10,6,8,.78)}
.box{background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px #0a0608,0 8px 30px #000a;border-radius:4px;
max-width:min(920px,100%);max-height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden}
.box.small{max-width:420px}
.hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid var(--line);background:var(--panel2)}
.hd h2{margin:0;font-size:18px;flex:1;letter-spacing:.05em}
.bd{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.ft{display:flex;gap:8px;padding:10px 14px;border-top:2px solid var(--line);flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--ink);background:#3a2a24;border:2px solid #6a4a36;border-radius:3px;padding:8px 14px;min-height:40px;cursor:pointer;touch-action:manipulation}
button:hover{background:#4a352c}
button:active{transform:translateY(1px)}
button.pri{background:#7a2018;border-color:#c23b2a}
button.pri:hover{background:#8e2a1e}
button:disabled{opacity:.4;cursor:default}
button.x{min-width:40px;padding:6px 10px}
.title{flex-direction:column;text-align:center;gap:10px;background:radial-gradient(ellipse at 50% 40%,#3a1a18 0,#120c10 70%)}
.title h1{margin:0;font-size:clamp(28px,6vw,52px);letter-spacing:.12em;text-shadow:0 3px 0 #7a2018,0 0 24px #c23b2a66}
.title .sub{color:var(--gold);letter-spacing:.3em;font-size:clamp(13px,2.4vw,18px)}
.title .btns{display:flex;flex-direction:column;gap:8px;min-width:220px;margin-top:8px}
.title .hint{color:var(--dim);font-size:12px;max-width:520px;line-height:1.6}
.ver{color:var(--dim);font-size:11px;margin:0}
.town{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.town .card{background:var(--panel2);border:2px solid var(--line);padding:10px;border-radius:3px}
.town button{width:100%;min-height:52px;font-size:17px;white-space:nowrap;padding-left:6px;padding-right:6px}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:2px 0;color:var(--dim)}
.stat b{color:var(--ink);font-weight:600}
.equip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.slot{position:relative;aspect-ratio:1;background:#120c10;border:2px solid #3a2a24;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0}
.slot img{width:70%;image-rendering:pixelated}
.slot.sel{outline:2px solid #fff;outline-offset:1px}
.slot .lb{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.slot .up{position:absolute;top:0;right:2px;font-size:12px;color:#7fe07f;font-weight:700}
.r0{border-color:var(--r0)!important}.r1{border-color:var(--r1)!important}.r2{border-color:var(--r2)!important}.r3{border-color:var(--r3)!important;box-shadow:0 0 8px #ff8a2a88}
.t0{color:var(--r0)}.t1{color:var(--r1)}.t2{color:var(--r2)}.t3{color:var(--r3)}
.detail{background:var(--panel2);border:2px solid var(--line);padding:10px;border-radius:3px;margin-top:10px;font-size:14px;line-height:1.55}
.detail h3{margin:0 0 4px;font-size:16px}
.detail .aff{color:#9fc6ff}
.detail .leg{color:var(--r3)}
.detail .cmp{color:var(--dim);font-size:13px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.detail .cmp .g{color:#7fe07f}.detail .cmp .b{color:#ff7a6a}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:2px solid var(--line);padding:8px;border-radius:3px;margin-bottom:8px}
.sk img{width:36px;image-rendering:pixelated;background:#120c10;border:2px solid #3a2a24;padding:3px;border-radius:3px}
.sk .nm{font-weight:700}.sk .ds{font-size:13px;color:var(--dim);line-height:1.5}
.sk .pips{color:var(--gold);letter-spacing:2px}
.sk .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sk .ctl button{min-height:34px;padding:4px 10px;font-size:13px}
.sk.pick{border-color:#fff}
.br.on{background:#7a2018;border-color:#e0b048}
.slots4{display:flex;gap:8px;margin:6px 0 12px}
.slots4 .slot{width:58px;flex:none}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:center;z-index:5}
.toast div{background:#120c10dd;border:1px solid var(--line);padding:5px 12px;border-radius:3px;font-size:14px;animation:fd 2.4s forwards;white-space:nowrap}
@keyframes fd{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.note{color:var(--dim);font-size:13px;line-height:1.6}
.pill{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--gold)}
select{font:inherit;color:var(--ink);background:#120c10;border:2px solid #6a4a36;min-height:40px;padding:4px 8px;border-radius:3px}
@media (max-width:700px),(max-height:500px){
 .split{grid-template-columns:1fr}
 .hd{padding:6px 10px}.bd{padding:8px 10px}.ft{padding:6px 10px}
 .hd h2{font-size:16px}
 button{min-height:38px;padding:6px 12px}
 .bag{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
}
@media (max-height:500px) and (min-width:600px){.split{grid-template-columns:1fr 1fr}.town{grid-template-columns:1fr 1fr 1fr}}
</style>

<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div class="scr title on" id="s-title">
    <div class="sub">조선퇴마록 외전</div>
    <h1>백귀사 百鬼寺</h1>
    <div class="btns">
      <button class="pri" id="b-cont">이어하기</button>
      <button id="b-new">새로 시작</button>
    </div>
    <p class="hint" id="t-hint"></p>
    <p class="ver" id="verTag">v0.1</p>
  </div>
  <div class="scr dim" id="s-town"></div>
  <div class="scr dim" id="s-bag"></div>
  <div class="scr dim" id="s-skill"></div>
  <div class="scr dim" id="s-forge"></div>
  <div class="scr dim" id="s-pause"></div>
  <div class="scr dim" id="s-msg"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ======================= 도움 함수 ======================= */
// 시드 난수(mulberry32): 같은 시드면 같은 결과 → 던전·장비 시험을 되풀이할 수 있다
function makeRng(seed) {
  let a = seed >>> 0 || 1;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rint = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function weighted(rng, ws) {
  let s = 0;
  for (const w of ws) s += w;
  let r = rng() * s;
  for (let i = 0; i < ws.length; i++) {
    r -= ws[i];
    if (r < 0) return i;
  }
  return ws.length - 1;
}
// 한국어 조사: 받침 있으면 a, 없으면 b
function josa(word, a, b) {
  const c = String(word).charCodeAt(String(word).length - 1);
  if (c < 0xac00 || c > 0xd7a3) return b;
  return (c - 0xac00) % 28 ? a : b;
}
/* ======================= 코드 도트 =======================
   틀(mk·선비 조립·요괴 틀 5종)은 조선퇴마록 src/js/01_sprites.js 에서 가져옴(같은 작가의 코드) */
const PAL = {k: '#1a1418', w: '#efe6d2', s: '#e8b98f', r: '#c23b2a', R: '#7a2018', g: '#3f9a5a', G: '#1d4d42', b: '#3a5f9e', B: '#1a2b4a', y: '#e0b048', o: '#b0702e', n: '#4a3a30', x: '#8a8494', X: '#4a4552', c: '#8fd3ff', p: '#b07fd0'};
function canvasOf(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}
function mk(rows, pal = PAL) {
  const h = rows.length,
    w = Math.max(...rows.map(r => r.length));
  const c = canvasOf(w, h);
  const x = c.getContext('2d');
  rows.forEach((r, j) => {
    for (let i = 0; i < r.length; i++) {
      const ch = r[i];
      if (ch !== '.' && pal[ch]) {
        x.fillStyle = pal[ch];
        x.fillRect(i, j, 1, 1);
      }
    }
  });
  return c;
}
// 바깥 빈칸에 1칸 어두운 테두리(밤 바닥 위에서도 보이게)
function outline(src, col = '#120c10') {
  const w = src.width + 2,
    h = src.height + 2;
  const c = canvasOf(w, h),
    x = c.getContext('2d');
  const d = src.getContext('2d').getImageData(0, 0, src.width, src.height).data;
  x.fillStyle = col;
  for (let j = 0; j < src.height; j++)
    for (let i = 0; i < src.width; i++) if (d[(j * src.width + i) * 4 + 3] > 0) x.fillRect(i, j, 3, 3);
  x.drawImage(src, 1, 1);
  return c;
}
function flipH(src) {
  const c = canvasOf(src.width, src.height),
    x = c.getContext('2d');
  x.translate(src.width, 0);
  x.scale(-1, 1);
  x.drawImage(src, 0, 0);
  return c;
}
function whiteOf(src) {
  const c = canvasOf(src.width, src.height),
    x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, c.width, c.height);
  return c;
}

/* --- 선비: 갓 + 얼굴 + 흰 도포 + 붓 (조선퇴마록 charSpr 의 선비 1차 모습) --- */
const HAT_GAT = ['...HHHH...', '...HHHH...', 'HHHHHHHHHH'];
const FACE = ['...ssss...', '...sksk...', '...ssss...'];
const BODY = ['..AAAAAA..', '.AAATTAAA.', '.sAAAAAAs.', '..ALLLLA..', '..AAAAAA..', '..AA..AA..', '..kk..kk..'];
const LEGS = [
  ['..AA..AA..', '..kk..kk..'],
  ['.AA....AA.', '.kk....kk.'],
  ['...AAAA...', '...kkkk...']
];
const BRUSH = [
  [10, 6, 'k'],
  [10, 7, 'n'],
  [10, 8, 'n'],
  [10, 9, 'n']
];
function seonbiFrame(legs, look) {
  const pal = {...PAL, H: '#1a1418', h: '#e0b048', A: look.A, T: look.T, L: '#1a1418'};
  const body = BODY.slice(0, 5).concat(LEGS[legs]);
  const g = [...HAT_GAT, ...FACE, ...body].map(r => ('.' + r + '.').split(''));
  for (const [x, y, c] of BRUSH) g[y][x] = c;
  return outline(mk(g.map(r => r.join('')), pal));
}

/* --- 요괴 틀(A 주색 · B 보조색) --- */
const TPL = {
  wisp: ['...A...', '..AAA..', '.ABABA.', '.AAABA.', 'ABAwABA', 'ABwwwBA', '.AwwwA.', '..AAA..'],
  blob: ['..AAAA..', '.AAAAAA.', 'AAwAAwAA', 'AArAArAA', 'AAAAAAAA', '.AAAAAA.', 'A.A..A.A'],
  goblin: [
    '....y.....',
    '...AAA....',
    '..AAAAAB..',
    '..AwAwAB..',
    '..AAAAA.B.',
    '..ArrrA.B.',
    '.AAAAAAA..',
    '.A.AAA.A..',
    '...AAA....',
    '...A.A....',
    '..kk.kk...'
  ],
  ghost: [
    '..kkkk..',
    '.kkkkkk.',
    '.kAkkAk.',
    '.kAAAAk.',
    '.krAArk.',
    '.kAAAAk.',
    '.BBBBBB.',
    'BBBBBBBB',
    '.BBBBBB.',
    '.BBBBBB.',
    '..B.BB.B',
    '.B..B...'
  ],
  fox: [
    '.A.A........',
    '.AAA......ww',
    'AAkAA....wAw',
    'AAAAAAAAAAA.',
    '.AAAAAAAAA..',
    '.AwwAAAAAA..',
    '..A.A..A.A..',
    '..k.k..k.k..'
  ]
};
const LEFT_FACING = new Set(['fox']);

/* --- 아이콘: 장비 4부위, 스킬 5개 --- */
const ICON_ROWS = {
  weapon: ['........yk', '.......yk.', '......nn..', '.....nn...', '....nn....', '...nn.....', '..nn......', '.ww.......', 'wkw.......', '.k........'],
  hat: ['..........', '...kkkk...', '...kkkk...', '...kkkk...', 'kkkkkkkkkk', '.kkkkkkkk.', '..........', '...y..y...', '....yy....', '..........'],
  robe: ['..wwwwww..', '.wwwbbwww.', 'wwwwbbwwww', 'w.wwwwww.w', 'w.wkkkkw.w', '..wwwwww..', '..wwwwww..', '..wwwwww..', '..ww..ww..', '..........'],
  charm: ['....yy....', '...y..y...', '....yy....', '....rr....', '...rrrr...', '..rrggrr..', '...rrrr...', '....rr....', '...r.r.r..', '..r..r..r.'],
  meok: ['..........', '...kkkk...', '..kkXkkk..', '.kkXXkkkk.', '.kkkkkkkk.', '.kkkkkkkk.', '..kkkkkk..', '...kkkk...', '..........', '..........'],
  hwa: ['.yyyyyyy..', '.yrrrrry..', '.yyyyyyy..', '.yyrryyy..', '.yrryrry..', '.yyrrryy..', '.yyyryyy..', '.yryryry..', '.yyyyyyy..', '...r.r....'],
  ilpil: ['.........k', '........kk', '.......kk.', '.....kkk..', '....kkk...', '..kkkk....', '.kkkk.....', 'kkkk......', 'kk........', '..........'],
  hanseol: ['....c.....', '.c..c..c..', '..c.c.c...', '...ccc....', 'ccccwcccc.', '...ccc....', '..c.c.c...', '.c..c..c..', '....c.....', '..........'],
  gyeol: ['...yyyy...', '..y....y..', '.y..yy..y.', 'y..y..y..y', 'y.y.rr.y.y', 'y.y.rr.y.y', 'y..y..y..y', '.y..yy..y.', '..y....y..', '...yyyy...']
};
const ICONS = {};
function icon(name) {
  return ICONS[name] || (ICONS[name] = outline(mk(ICON_ROWS[name]), '#a8967a')); // 밝은 테두리: 검은 먹·갓도 어두운 바탕에서 보이게
}

/* --- 그림 묶음(처음 쓸 때 한 번 만든다) --- */
let ART = null;
function art() {
  if (ART) return ART;
  ART = {player: [], ens: {}, tiles: null};
  const look = {A: '#efe6d2', T: '#efe6d2'};
  for (let i = 0; i < 3; i++) {
    const R = seonbiFrame(i, look);
    ART.player.push({R, L: flipH(R), W: whiteOf(R)});
  }
  ART.tiles = makeTiles();
  return ART;
}
function enemyArt(D, elite) {
  const key = D.n + (elite ? '*' : '');
  const A = art();
  if (A.ens[key]) return A.ens[key];
  const pal = {...PAL, A: D.A, B: D.B || D.A};
  let base = outline(mk(TPL[D.t], pal), elite ? '#3a0a0a' : '#120c10');
  if (LEFT_FACING.has(D.t)) base = flipH(base);
  return (A.ens[key] = {R: base, L: flipH(base), W: whiteOf(base)});
}

/* --- 바닥·벽 타일 16×16 (모두 코드로) --- */
function makeTiles() {
  const rng = makeRng(77);
  const t = n => canvasOf(16, 16);
  const px = (x, c, X, Y, w = 1, h = 1) => ((x.fillStyle = c), x.fillRect(X, Y, w, h));
  const floor = [0, 1, 2].map(v => {
    const c = t(),
      x = c.getContext('2d');
    px(x, '#3a3330', 0, 0, 16, 16);
    // 박석(넓적한 돌) 이음새
    px(x, '#2c2624', 0, 7, 16, 1);
    px(x, '#2c2624', v === 1 ? 10 : 5, 0, 1, 7);
    px(x, '#2c2624', v === 2 ? 3 : 12, 8, 1, 8);
    for (let i = 0; i < 9; i++) px(x, rng() < 0.5 ? '#433b37' : '#342d2a', rint(rng, 0, 15), rint(rng, 0, 15));
    if (v === 2) (px(x, '#4b5a3a', 2, 2, 2, 1), px(x, '#4b5a3a', 3, 3, 1, 1)); // 이끼
    return c;
  });
  const wall = t(),
    wx = wall.getContext('2d');
  px(wx, '#241b1a', 0, 0, 16, 16);
  px(wx, '#4a2a22', 0, 0, 16, 4); // 기와 밑 서까래
  px(wx, '#6e3a2a', 0, 4, 16, 2);
  for (let i = 0; i < 16; i += 4) px(wx, '#1a1214', i, 6, 1, 10);
  px(wx, '#1a1214', 0, 15, 16, 1);
  const pillar = t(),
    pxx = pillar.getContext('2d');
  px(pxx, '#3a3330', 0, 0, 16, 16);
  px(pxx, '#1a1214', 3, 13, 10, 3);
  px(pxx, '#8a3020', 4, 1, 8, 13); // 붉은 기둥
  px(pxx, '#b0442c', 5, 1, 2, 13);
  px(pxx, '#5a1e16', 10, 1, 2, 13);
  px(pxx, '#6a5a4a', 3, 12, 10, 2); // 주춧돌
  const water = [0, 1].map(v => {
    const c = t(),
      x = c.getContext('2d');
    px(x, '#1d3a4a', 0, 0, 16, 16);
    px(x, '#2a5a6a', v ? 2 : 6, 4, 5, 1);
    px(x, '#2a5a6a', v ? 9 : 4, 10, 5, 1);
    px(x, '#3f7a8a', v ? 12 : 1, 7, 2, 1);
    return c;
  });
  const lantern = t(),
    lx = lantern.getContext('2d');
  px(lx, '#3a3330', 0, 0, 16, 16);
  px(lx, '#6a6460', 6, 10, 4, 5);
  px(lx, '#7a7470', 4, 4, 8, 6);
  px(lx, '#ffcf6a', 6, 6, 4, 2);
  px(lx, '#5a5450', 3, 3, 10, 1);
  px(lx, '#7a7470', 5, 2, 6, 1);
  return {floor, wall, pillar, water, lantern};
}
/* ======================= 게임 데이터 ======================= */
const GAME_VER = 'v0.1';
const SAVE_KEY = 'baekgwisa-save';
const SAVE_VER = 1;
const MAX_LVL = 30;
const BAG_MAX = 30;
const TILE = 16;

/* --- 선비 기본 능력치 --- */
const BASE_STATS = {maxHp: 100, hpPerLvl: 8, maxKi: 100, kiRegen: 4, armor: 0, crit: 5, critDmg: 50, move: 72};

/* --- 스킬 5개(설계 3절). kind: proj 투사체 · line 획 · nova 둘레 · shield 결계 --- */
const SKILLS = {
  meok: {
    name: '먹탄',
    kind: 'proj',
    type: 'phys',
    cost: 0,
    gain: 6,
    cd: 0.4,
    coef: 1.0,
    range: 190,
    speed: 270,
    desc: '먹 덩어리를 날린다. 기력을 쓰지 않고 오히려 6 채운다.',
    br: [
      {n: '번지는 먹', d: '맞은 자리에서 작게 터진다(반경 22, 피해 50%).'},
      {n: '꿰뚫는 먹', d: '요괴 2마리를 더 꿰뚫는다.'}
    ]
  },
  hwa: {
    name: '화염부',
    kind: 'proj',

function baseStats(slot, il) {
  const g = Math.pow(1.1, il - 1);
  if (slot === 'weapon') return {power: Math.round(6 * Math.pow(1.12, il - 1) * 10) / 10};
  if (slot === 'hat') return {armor: Math.round(4 * g), hp: Math.round(8 * g)};
  if (slot === 'robe') return {armor: Math.round(7 * g), hp: Math.round(12 * g)};
  return {ki: Math.round(10 * Math.pow(1.04, il - 1))};
}
function rollItem(rng, slot, il, rar) {
  const nAff = [() => 0, () => rint(rng, 1, 2), () => rint(rng, 3, 4), () => rint(rng, 2, 3)][rar]();
  const pool = Object.keys(AFFIXES).filter(k => AFFIXES[k].slots.includes(slot));
  const affixes = [];
  while (affixes.length < nAff && affixes.length < pool.length) {
    const k = pick(rng, pool);
    if (affixes.some(a => a.k === k)) continue;
    affixes.push({k, v: affixValue(k, il, rng())});
  }
  const band = Math.min(3, Math.floor((il - 1) / 3));
  const it = {uid: ITEM_SEQ++, slot, il, rar, base: BASES[slot][band], affixes, rr: 0, ...baseStats(slot, il)};
  if (slot === 'weapon') it.power = Math.round(it.power * (0.9 + 0.2 * rng()) * 10) / 10;
  if (rar === 3) it.legend = pick(rng, Object.keys(LEGENDS));
  return it;
}

}
function calcStats(ch) {
  const B = BASE_STATS;
  const S = {
    power: 0,
    maxHp: B.maxHp + B.hpPerLvl * (ch.lvl - 1),
    maxKi: B.maxKi,
    kiRegen: B.kiRegen,
    kiRegenPct: 0,
    armor: B.armor,
    crit: B.crit,
    critDmg: B.critDmg,
    dmgPct: 0,
    firePct: 0,
    coldPct: 0,
    regen: 0,
    cdr: 0,
    move: B.move,
    movePct: 0,
    ranks: {},
    branches: {},
    legends: []
  };
  for (const [id, s] of Object.entries(ch.skills)) {
    S.ranks[id] = s.rank;
    if (s.br) S.branches[id] = s.br;
  }
  for (const slot of SLOTS) {
    const it = ch.equip[slot];
    if (!it) continue;
    if (it.power) S.power += it.power;
    if (it.armor) S.armor += it.armor;
    if (it.hp) S.maxHp += it.hp;
    if (it.ki) S.maxKi += it.ki;
    for (const a of it.affixes) AFFIXES[a.k].ap(S, a.v);
    if (it.legend && !S.legends.includes(it.legend)) S.legends.push(it.legend);
  }
  if (!S.power) S.power = 3; // 붓이 없으면 맨손
  for (const id in S.ranks) S.ranks[id] = Math.min(SKILL_MAX + 2, S.ranks[id]);
  S.cdr = Math.min(40, S.cdr);
  S.legends.sort();
  S.kiRegenFinal = Math.round(S.kiRegen * (1 + S.kiRegenPct / 100) * 100) / 100;
  S.moveFinal = Math.round(S.move * (1 + S.movePct / 100) * 100) / 100;
  return S;
}

function skillHit(S, id, part = 1) {
  const sk = SKILLS[id];
  const r = S.ranks[id] || 1;
  const typePct = sk.type === 'fire' ? S.firePct : sk.type === 'cold' ? S.coldPct : 0;
  let m = sk.coef * S.power * (1 + (S.dmgPct + typePct) / 100) * rankMul(r) * part;
  if (id === 'hanseol' && S.branches.hanseol === 2) m *= 1.25;
  return m;
}
const skillCd = (S, id) => SKILLS[id].cd * (1 - S.cdr / 100);

const spentPoints = ch => Object.entries(ch.skills).reduce((s, [id, v]) => s + v.rank - (id === 'meok' ? 1 : 0), 0);

function learn(ch, id) {
  if (!SKILLS[id] || freePoints(ch) <= 0) return false;
  const s = ch.skills[id] || {rank: 0, br: 0};
  if (s.rank >= SKILL_MAX) return false;
  s.rank++;
  ch.skills[id] = s;
  if (s.rank === 1 && !ch.slots.includes(id)) {
    const free = ch.slots.indexOf(null);
    if (free >= 0) ch.slots[free] = id;
  }
  return true;
}
function chooseBranch(ch, id, b) {
  const s = ch.skills[id];
  if (!s || s.rank < BRANCH_AT || (b !== 1 && b !== 2)) return false;
  s.br = b;

}

function compareLines(ch, it) {
  const a = calcStats(ch);

  const b = calcStats(tmp);
  const fmt = (v, d) => (d ? (Math.round(v * 10) / 10).toFixed(1) : String(Math.round(v)));

/* --- 자동 조준: 잡은 대상 유지 → 없으면 가장 가까운(시선 열린) 적 --- */

  let best = null,
    bd = Infinity;

/* --- 피해: 요괴에게는 hurt 하나로만 --- */
function hurt(w, e, amt, src, type, o = {}) {
  if (e.dead || amt <= 0) return 0;
  let crit = false;
  if (!o.nocrit && w.rng() * 100 < w.S.crit) {
    amt *= 1 + w.S.critDmg / 100;
    crit = true;
  }
  amt *= 1 - e.dr;
  if (e.frozen > 0) amt *= 1.2; // 얼음 감옥

    if (w.t - e.capT >= 1) (e.capT = w.t), (e.capUsed = 0);
    const room = e.maxHp * BOSS_CAP - e.capUsed;
    amt = Math.max(0, Math.min(amt, room));
    e.capUsed += amt;

  amt = Math.min(amt, e.hp);
  e.hp -= amt;
  e.sleep = false;
  e.hitT = 0.12;

  if (type === 'fire' && !o.noStatus) e.burn = {dps: (amt / (crit ? 1 + w.S.critDmg / 100 : 1)) * 0.2, t: 3, src};
  if (type === 'cold' && !o.noStatus) (e.slow = Math.max(e.slow, 0.4)), (e.slowT = 2);

}

    for (const o of w.ens)

// 복숭아: 민간에서 귀신을 쫓는다고 믿은 과일(한국민족문화대백과사전 「복숭아」). 주우면 체력 회복

/* --- 플레이어가 맞음 --- */
function hurtPlayer(w, amt, src, type) {
  const p = w.p;
  if (w.state !== 'play' || p.iframe > 0 || p.dodgeT > 0 || amt <= 0) return 0;
  amt *= 1 - armorReduce(w.S.armor, w.ml);
  if (p.shield) {
    const ab = Math.min(p.shield.amt, amt);
    p.shield.amt -= ab;
    amt -= ab;

  }

  p.hurtT = 0.15;

/* --- 보스 공격(예고 → 실행) --- */

const segDist2 = (px, py, x1, y1, x2, y2) => {

/* --- 효과 그림 도움 --- */
function burst(w, x, y, n, c) {

/* --- 한 걸음 --- */
function update(w, dt, inp) {
  if (w.state !== 'play') return;

    return;
  }
  w.t += dt;
  const p = w.p,
    S = w.S;
  // 이동·회피
  p.dodgeCd = Math.max(0, p.dodgeCd - dt);
  p.iframe = Math.max(0, p.iframe - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);
  p.castT = Math.max(0, p.castT - dt);
  let mx = inp.mx || 0,
    my = inp.my || 0;
  const ml = Math.hypot(mx, my);
  if (ml > 1) (mx /= ml), (my /= ml);
  if (inp.dodge && p.dodgeCd <= 0 && p.dodgeT <= 0) {
    const a = ml > 0.1 ? Math.atan2(my, mx) : p.face;
    p.dodgeT = DODGE_T;
    p.dodgeA = a;
    p.dodgeCd = DODGE_CD;
    p.iframe = IFRAME;
    sfx('dodge');
  }
  if (p.dodgeT > 0) {
    p.dodgeT -= dt;
    moveCircle(w.map, p, Math.cos(p.dodgeA) * DODGE_SPD * dt, Math.sin(p.dodgeA) * DODGE_SPD * dt);
  } else if (ml > 0.05) {
    const sp = S.moveFinal * (p.burn > 0 ? 1 : 1);
    moveCircle(w.map, p, mx * sp * dt, my * sp * dt);
    p.face = Math.atan2(my, mx);
    if (Math.abs(mx) > 0.1) p.fx = mx > 0 ? 1 : -1;
    p.walk += dt;
  }
  // 회복
  const kiMul = p.shield && S.branches.gyeol === 2 ? 2 : 1;
  p.ki = Math.min(S.maxKi, p.ki + S.kiRegenFinal * kiMul * dt);
  if (w.godKi) p.ki = S.maxKi;
  p.hp = Math.min(S.maxHp, p.hp + S.regen * dt);
  if (p.burn > 0) {
    p.burn -= dt;
    p.hp -= w.S.maxHp * 0.02 * dt;
    w.rs.taken += w.S.maxHp * 0.02 * dt;
    if (p.hp <= 0) (p.hp = 0), (w.state = 'dead'), w.events.push({k: 'dead'});

  for (const id in p.cds) p.cds[id] = Math.max(0, p.cds[id] - dt);
  if (p.dodgeT <= 0) for (let i = 0; i < 4; i++) if (inp.cast && inp.cast[i] && w.ch.slots[i]) castSkill(w, w.ch.slots[i], inp.aim);
  // 늦게 터지는 것
  for (let i = w.later.length - 1; i >= 0; i--) {

    L.t -= dt;
    if (L.t <= 0) {
      L.fn();
      w.later.splice(i, 1);
    }
  }
  w.flowT = (w.flowT || 0) - dt;
  if (w.flowT <= 0) {
    w.flowT = 0.4;

      w.drops.splice(i, 1);
      sfx('pick');
      if (w.fx.length < CAP.fx) w.fx.push({k: 'ring', x: p.x, y: p.y - 5, r: 10, t: 0.3, T: 0.3, c: '#ff9aa8'});

      w.drops.splice(i, 1);
      sfx('coin');
    } else if (w.ch.bag.length < BAG_MAX) {
      w.ch.bag.push(d.item);
      w.drops.splice(i, 1);
      w.events.push({k: 'pick', item: d.item});

      w.events.push({k: 'full'});
    }

  for (let i = w.fx.length - 1; i >= 0; i--) {
    const f = w.fx[i];
    f.t -= dt;
    if (f.vx !== undefined) (f.x += f.vx * dt), (f.y += f.vy * dt), (f.vx *= 0.9), (f.vy *= 0.9);

    n.y -= 18 * dt;

  }
}

function updateProjs(w, dt) {

    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    pr.life -= dt;
    let end = pr.life <= 0;
    const t = w.map.tiles[Math.floor(pr.y / TILE) * w.map.w + Math.floor(pr.x / TILE)];
    if (t === 1 || t === 2 || t === 4 || t === undefined) end = true;

          if (pr.splash) {
            for (const o of w.ens) if (!o.dead && o !== e && dist2(e.x, e.y, o.x, o.y) < (pr.splash.r + o.r) ** 2) hurt(w, o, pr.dmg * pr.splash.part, pr.src, pr.type, {quiet: 1});

            end = true;
            break;
          }
        }
      }

    const h = w.hprojs[i];
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.life -= dt;
    const t = w.map.tiles[Math.floor(h.y / TILE) * w.map.w + Math.floor(h.x / TILE)];
    let end = h.life <= 0 || t === 1 || t === 2 || t === 4 || t === undefined;
    if (!end && dist2(h.x, h.y, p.x, p.y) < (h.r + p.r) ** 2) {
      hurtPlayer(w, h.dmg, h.src, 'phys');

    }

  }
}

    P.t -= dt;
    P.tick -= dt;
    if (P.tick <= 0) {
      P.tick += P.every;
      for (const e of w.ens) {
        if (e.dead || e.sleep) continue;
        const hit = P.line ? segDist2(e.x, e.y, P.x, P.y, P.x2, P.y2) < (P.wd / 2 + e.r) ** 2 : dist2(e.x, e.y, P.x, P.y) < (P.r + e.r) ** 2;
        if (!hit) continue;
        hurt(w, e, P.dmg, P.src, P.type, {quiet: 1});
        if (P.slow) (e.slow = Math.max(e.slow, P.slow)), (e.slowT = Math.max(e.slowT, 0.6));
      }
    }
    if (P.t <= 0) w.pools.splice(i, 1);
  }
}

function updateEnemies(w, dt) {
  const p = w.p;
  for (const e of w.ens) {
    if (e.dead) continue;
    e.hitT = Math.max(0, e.hitT - dt);

  }
}
function drawMinimap(c, w, u) {
  const m = w.map,
    p = w.p;
  const cur = m.rooms.find(r => p.x >= r.x0 * TILE && p.x < (r.x0 + ROOM_W) * TILE && p.y >= r.y0 * TILE && p.y < (r.y0 + ROOM_H) * TILE);
  if (cur) R_.seen.add(cur);
  const s = 3 * u,
    cv = R_.cv;
  const gw = m.w / ROOM_W,
    gh = m.h / ROOM_H;
  const X0 = cv.width - 12 * u - 40 * u - gw * 6 * s,
    Y0 = 12 * u;
  for (const r of m.rooms) {
    if (!R_.seen.has(r)) continue;
    const x = X0 + (r.x0 / ROOM_W) * 6 * s,
      y = Y0 + (r.y0 / ROOM_H) * 5 * s;
    c.fillStyle = r === cur ? '#efe6d2' : r.kind === 'boss' ? '#c23b2a' : r.kind === 'exit' ? '#e0b048' : '#5a4a40';
    c.fillRect(x, y, 5 * s, 4 * s);
  }
}
/* ======================= 화면(마을·가방·수련·대장간·멈춤·알림) ======================= */
const GS = {mode: 'title', ch: null, w: null, modal: null, back: null, sel: null, skSel: null, forgeSel: null, forgeAff: null, forgeLog: '', mute: false, loadStatus: '', tierPick: null, saveWarned: false};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[ch]);
const ICON_URL = {};
function iconURL(n) {
  if (ICON_URL[n]) return ICON_URL[n];
  const c = icon(n);
  return (ICON_URL[n] = c.toDataURL ? c.toDataURL() : '');
}
function showScr(id) {
  for (const s of document.querySelectorAll('.scr')) s.classList.toggle('on', s.id === id);
}
function toast(html) {
  const t = $('toast');
  const d = document.createElement('div');
  d.innerHTML = html;
  t.appendChild(d);
  setTimeout(() => d.remove(), 2400);

}
// 화면 안 버튼은 data-a 로 묶는다
function wire(el, acts) {
  el.onclick = e => {
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    if (performance.now() / 1000 < IN.guardUntil) return; // 창이 막 열렸을 때 잘못 누름 방지
    const f = acts[b.dataset.a];
    if (f) f(b.dataset.v, b);
  };
}
function persist() {
  if (!GS.ch) return;

  try {
    ok = writeSave(localStorage, GS.ch);
  } catch (e) {}
  if (!ok && !GS.saveWarned) {
    GS.saveWarned = true;
    toast('<b style="color:#ff7a6a">저장하지 못했습니다.</b> 사생활 보호(비공개) 창이거나 저장 공간이 꽉 찼는지 확인하세요.');

}

/* --- 가방 --- */
function slotHTML(it, label, sel, up) {
  if (!it) return `<div class="slot" data-a="none"><span class="lb">${label || ''}</span></div>`;
  return `<div class="slot r${it.rar} ${sel ? 'sel' : ''}" data-a="sel" data-v="${it.uid}"><img src="${iconURL(it.slot)}" alt="">${up ? '<span class="up">▲</span>' : ''}${label ? `<span class="lb">${label}</span>` : ''}</div>`;
}
function findItem(uid) {
  uid = +uid;
  const ch = GS.ch;
  for (const s of SLOTS) if (ch.equip[s] && ch.equip[s].uid === uid) return {it: ch.equip[s], where: 'equip'};
  const i = ch.bag.findIndex(x => x.uid === uid);
  return i >= 0 ? {it: ch.bag[i], where: 'bag', i} : null;
}
function itemDetail(it, cmp) {
  let h = `<h3 class="t${it.rar}">${esc(itemName(it))}</h3><div class="note">${RAR_NAME[it.rar]} ${SLOT_NAME[it.slot]} · 장비 Lv ${it.il}</div>`;
  if (it.power) h += `<div>공력 ${it.power}</div>`;
  if (it.armor) h += `<div>방어 ${it.armor} · 체력 +${it.hp}</div>`;
  if (it.ki) h += `<div>기력 +${it.ki}</div>`;
  for (const a of it.affixes) h += `<div class="aff">${esc(affixText(a))}</div>`;
  if (it.legend) h += `<div class="leg">◆ ${LEGENDS[it.legend].n}: ${LEGENDS[it.legend].d}</div>`;
  if (cmp) {
    const lines = compareLines(GS.ch, it);
    h += `<div class="cmp">입으면: ${lines.length ? lines.map(l => colorCmp(l)).join('<br>') : '달라지는 것 없음'}</div>`;
  }
  return h;
}
function colorCmp(l) {
  const m = l.match(/(-?[\d.]+)%? → (-?[\d.]+)%?$/);
  if (m) return `<span class="${+m[2] > +m[1] ? 'g' : 'b'}">${esc(l)}</span>`;
  return `<span class="${l.includes('생김') ? 'g' : 'b'}">${esc(l)}</span>`;
}
function better(it) {
  const ch = GS.ch;
  const tmp = {...ch, equip: {...ch.equip, [it.slot]: it}};
  return gearScore(tmp) > gearScore(ch) * 1.001;
}
function openBag(back) {
  GS.back = back;
  GS.modal = 'bag';
  guardInput();
  renderBag();
}
function renderBag() {
  const ch = GS.ch,
    el = $('s-bag');
  const inTown = GS.mode === 'town';
  const sel = GS.sel && findItem(GS.sel);
  const eq = SLOTS.map(s => slotHTML(ch.equip[s], SLOT_NAME[s], sel && sel.it === ch.equip[s])).join('');
  const bag = ch.bag.map(it => slotHTML(it, '', sel && sel.it === it, better(it))).join('') + Array.from({length: BAG_MAX - ch.bag.length}, () => '<div class="slot" style="opacity:.35"></div>').join('');
  let act = '';
  if (sel) {
    act = sel.where === 'bag' ? `<button class="pri" data-a="wear">입기</button>` : ch.bag.length < BAG_MAX && sel.it.slot !== 'weapon' ? `<button data-a="off">벗기</button>` : '';
    if (inTown && sel.where === 'bag') act += `<button data-a="sell">팔기 (엽전 ${sellPrice(sel.it)})</button>`;
    if (!inTown && GS.w && sel.where === 'bag') act += `<button data-a="drop">바닥에 내려놓기</button>`;
  }
  const junk = ch.bag.filter(it => it.rar <= 1 && !better(it));
  el.innerHTML = `<div class="box"><div class="hd"><h2>가방</h2><span class="pill">엽전 ${ch.gold}</span><button class="x" data-a="close">✕</button></div>
   <div class="bd"><div class="split"><div>
    <div class="note">입은 장비</div><div class="equip">${eq}</div>
    <div class="note">가방 ${ch.bag.length}/${BAG_MAX} · <span style="color:#7fe07f">▲</span> 지금보다 좋음</div><div class="bag">${bag}</div>
   </div><div>${sel ? `<div class="detail">${itemDetail(sel.it, sel.where === 'bag')}</div>` : '<div class="detail note">장비를 누르면 자세히 보고, 입었을 때 무엇이 「지금 → 바뀐 뒤」로 달라지는지 볼 수 있습니다.</div>'}</div></div></div>
   <div class="ft">${inTown && junk.length ? `<button data-a="selljunk">일반·마법 중 안 좋은 것 ${junk.length}개 팔기</button>` : ''}${act}<button data-a="close">닫기</button></div></div>`;
  showScr('s-bag');
  wire(el, {
    sel: v => ((GS.sel = +v), renderBag()),
    none: () => ((GS.sel = null), renderBag()),
    close: closeModal,
    wear: () => {
      const f = findItem(GS.sel);
      if (!f || f.where !== 'bag') return;
      const old = ch.equip[f.it.slot];
      ch.bag.splice(f.i, 1);
      if (old) ch.bag.push(old);
      ch.equip[f.it.slot] = f.it;
      afterGearChange();
      sfx('equip');
      renderBag();
    },
    off: () => {
      const f = findItem(GS.sel);
      if (!f || f.where !== 'equip' || ch.bag.length >= BAG_MAX || f.it.slot === 'weapon') return;
      delete ch.equip[f.it.slot];
      ch.bag.push(f.it);
      afterGearChange();
      renderBag();
    },
    drop: () => {
      const f = findItem(GS.sel);
      if (!f || f.where !== 'bag' || !GS.w) return;
      ch.bag.splice(f.i, 1);
      dropItem(GS.w, GS.w.p.x, GS.w.p.y, f.it, {hold: 1});
      GS.sel = null;
      persist();
      renderBag();
    },
    sell: () => {
      const f = findItem(GS.sel);
      if (!f || f.where !== 'bag') return;
      ch.gold += sellPrice(f.it);
      ch.bag.splice(f.i, 1);
      GS.sel = null;
      sfx('coin');
      persist();
      renderBag();
    },
    selljunk: () => {
      let g = 0;
      ch.bag = ch.bag.filter(it => {
        if (it.rar <= 1 && !better(it)) return (g += sellPrice(it)), false;
        return true;
      });
      ch.gold += g;
      GS.sel = null;
      toast(`엽전 +${g}`);
      sfx('coin');
      persist();
      renderBag();
    }

}
function afterGearChange() {
  // 단계 옵션을 벗어 쓸 수 없게 된 스킬은 칸에서 내린다
  const ok = usableSkills(GS.ch);
  GS.ch.slots = GS.ch.slots.map(s => (s && ok.includes(s) ? s : null));
  if (!GS.ch.slots.some(Boolean)) GS.ch.slots[0] = 'meok';
  if (GS.w) refreshStats(GS.w);
  persist();
}

/* --- 수련(스킬 트리) --- */
function openSkill(back) {
  GS.back = back;
  GS.modal = 'skill';
  GS.skSel = null;
  guardInput();
  renderSkill();
}
function renderSkill() {
  const ch = GS.ch,
    el = $('s-skill'),
    S = calcStats(ch),
    fp = freePoints(ch);

    const sk = SKILLS[id],
      s = ch.skills[id] || {rank: 0, br: 0},

    const brText = s.br ? `<div class="ds" style="color:#ffd451">갈래 「${sk.br[s.br - 1].n}」: ${sk.br[s.br - 1].d}</div>` : `<div class="ds">${BRANCH_AT}단계에서 갈래 선택: ${sk.br.map(b => `「${b.n}」 ${b.d}`).join(' / ')}</div>`;
    const cost = sk.cost ? `기력 ${sk.cost}` : '기력 +' + sk.gain;
    return `<div class="sk ${GS.skSel === id ? 'pick' : ''}"><img src="${iconURL(id)}" alt=""><div style="flex:1">
      <div class="nm">${sk.name} <span class="pips">${pips}</span></div>
      <div class="ds">${sk.desc} · ${cost} · 재사용 ${sk.cd}초${eff ? ` · 피해 계수 ×${(sk.coef * rankMul(eff)).toFixed(2)}` : ''}</div>${brText}
      <div class="ctl"><button data-a="learn" data-v="${id}" ${fp <= 0 || s.rank >= SKILL_MAX ? 'disabled' : ''}>배우기 (${s.rank} → ${Math.min(SKILL_MAX, s.rank + 1)})</button>${brs}
      <button data-a="pick" data-v="${id}" ${eff ? '' : 'disabled'}>칸에 놓기</button></div></div></div>`;
  }).join('');
  const slots = ch.slots.map((id, i) => `<div class="slot ${GS.skSel ? 'sel' : ''}" data-a="slot" data-v="${i}">${id ? `<img src="${iconURL(id)}" alt="">` : ''}<span class="lb">${['1·좌', '2·우', '3', '4'][i]}</span></div>`).join('');
  el.innerHTML = `<div class="box"><div class="hd"><h2>수련</h2><span class="pill">수련점 ${fp}</span><button class="x" data-a="close">✕</button></div>
   <div class="bd"><div class="note">버튼 칸 ${GS.skSel ? `— <b style="color:#fff">「${SKILLS[GS.skSel].name}」을(를) 놓을 칸을 누르세요</b>` : '(스킬의 「칸에 놓기」를 누른 뒤 칸을 고릅니다. 칸을 누르면 비웁니다)'}</div>
   <div class="slots4">${slots}</div>${rows}</div>

      const [id, b] = v.split(':');

      } else if (ch.slots.filter(Boolean).length > 1) ch.slots[i] = null;

      renderSkill();
    },
    respec: () => {
      respec(ch);
      afterGearChange();
      renderSkill();
    }
  });
}

/* --- 대장간: 옵션 하나 다시 굴리기 --- */
function openForge() {
  GS.modal = 'forge';
  GS.back = 'town';
  GS.forgeSel = null;
  GS.forgeAff = null;
  GS.forgeLog = '';
  guardInput();
  renderForge();
}
function renderForge() {
  const ch = GS.ch,
    el = $('s-forge');
  const items = [...SLOTS.map(s => ch.equip[s]).filter(Boolean), ...ch.bag].filter(it => it.affixes.length);
  const sel = GS.forgeSel && findItem(GS.forgeSel);
  let right = '<div class="detail note">옵션이 붙은 장비를 고르고, 바꿀 옵션 하나를 고르면 엽전을 내고 다른 옵션으로 다시 굴립니다. 같은 장비를 다시 굴릴수록 값이 오릅니다.</div>';
  if (sel) {
    const it = sel.it,
      cost = rerollCost(it);
    right = `<div class="detail"><h3 class="t${it.rar}">${esc(itemName(it))}</h3>${it.affixes
      .map((a, i) => `<div><button style="width:100%;text-align:left;margin:2px 0" class="${GS.forgeAff === i ? 'br on' : ''}" data-a="aff" data-v="${i}">${esc(affixText(a))}</button></div>`)
      .join('')}${it.legend ? `<div class="leg">◆ ${LEGENDS[it.legend].n} (전설 효과는 그대로)</div>` : ''}
      <div class="cmp">${GS.forgeLog || ''}</div></div>
      <div class="ft" style="padding:8px 0"><button class="pri" data-a="roll" ${GS.forgeAff == null || ch.gold < cost ? 'disabled' : ''}>다시 굴리기 (엽전 ${cost} / 가진 엽전 ${ch.gold})</button></div>`;
  }
  el.innerHTML = `<div class="box"><div class="hd"><h2>대장간</h2><span class="pill">엽전 ${ch.gold}</span><button class="x" data-a="close">✕</button></div>
   <div class="bd"><div class="split"><div><div class="bag">${items.map(it => slotHTML(it, '', sel && sel.it === it)).join('') || '<span class="note">옵션이 붙은 장비가 없습니다.</span>'}</div></div><div>${right}</div></div></div>
   <div class="ft"><button data-a="close">닫기</button></div></div>`;
  showScr('s-forge');
  wire(el, {
    close: closeModal,
    sel: v => ((GS.forgeSel = +v), (GS.forgeAff = null), (GS.forgeLog = ''), renderForge()),
    aff: i => ((GS.forgeAff = +i), renderForge()),
    roll: () => {
      const f = findItem(GS.forgeSel);
      if (!f || GS.forgeAff == null) return;
      const cost = rerollCost(f.it);
      if (ch.gold < cost) return;
      const nx = rerollAffix(Math.random, f.it, GS.forgeAff);
      if (!nx) return;
      ch.gold -= cost;
      GS.forgeLog = `${esc(affixText(f.it.affixes[GS.forgeAff]))} → <b style="color:#ffd451">${esc(affixText(nx.affixes[GS.forgeAff]))}</b>`;
      if (f.where === 'equip') ch.equip[f.it.slot] = nx;
      else ch.bag[f.i] = nx;
      GS.forgeSel = nx.uid;
      sfx('forge');
      afterGearChange();
      renderForge();
    }
  });
}

/* --- 멈춤·알림 --- */
function openPause() {
  if (GS.mode !== 'dungeon' || GS.modal) return;
  GS.modal = 'pause';
  guardInput();
  const el = $('s-pause');
  el.innerHTML = `<div class="box small"><div class="hd"><h2>멈춤</h2></div><div class="bd" style="display:flex;flex-direction:column;gap:8px">
   <button class="pri" data-a="resume">계속하기</button><button data-a="bag">가방 (I)</button><button data-a="skill">수련 (K)${freePoints(GS.ch) > 0 ? ' +' + freePoints(GS.ch) : ''}</button>
   <button data-a="mute">소리 ${GS.mute ? '켜기' : '끄기'}</button><button data-a="home">마을로 돌아가기</button>
   <p class="note">마을로 돌아가면 이번 출정의 층 진행은 사라지지만, 주운 장비·엽전·레벨은 남습니다.</p></div></div>`;
  showScr('s-pause');
  wire(el, {
    resume: closeModal,
    bag: () => openBag('pause'),
    skill: () => openSkill('pause'),
    mute: () => {
      GS.mute = !GS.mute;
      try {
        localStorage.setItem('baekgwisa-mute', GS.mute ? '1' : '');
      } catch (e) {}
      GS.modal = null;
      openPause();
    },
    home: () => goTown()
  });
}
function msg(title, html, buttons) {
  GS.modal = 'msg';
  guardInput(0.5);
  const el = $('s-msg');
  el.innerHTML = `<div class="box small"><div class="hd"><h2>${title}</h2></div><div class="bd note" style="color:var(--ink);font-size:15px">${html}</div><div class="ft">${buttons.map((b, i) => `<button ${b.pri ? 'class="pri"' : ''} data-a="b${i}">${b.t}</button>`).join('')}</div></div>`;
  showScr('s-msg');
  const acts = {};
  buttons.forEach((b, i) => (acts['b' + i] = () => ((GS.modal = null), b.fn())));
  wire(el, acts);
}
function closeModal() {
  GS.sel = null;
  GS.modal = null;
  guardInput(0.25);
  if (GS.mode === 'town') return goTown();
  if (GS.back === 'pause' && GS.mode === 'dungeon') {
    GS.back = null;
    return openPause();
  }
  showScr('none');
}
function onKeyMenu(which) {
  if (GS.mode === 'dungeon') {
    if (GS.modal) {
      if (GS.modal !== 'msg') {
        GS.back = null;
        closeModalToGame();
      }
      return;
    }
    if (which === 'pause') return openPause();
    GS.back = null;
    return which === 'bag' ? openBag(null) : openSkill(null);
  }
  if (GS.mode === 'town') {
    if (GS.modal && GS.modal !== 'msg') return closeModal();
    if (!GS.modal && which === 'bag') return openBag('town');
    if (!GS.modal && which === 'skill') return openSkill('town');
  }
}
function closeModalToGame() {
  GS.sel = null;
  GS.modal = null;
  guardInput(0.25);
  showScr('none');
}
/* ======================= 소리: Web Audio 합성 ======================= */
const AU = {ctx: null, last: {}};
function unlockAudio() {
  if (AU.ctx || typeof AudioContext === 'undefined') return;
  try {
    AU.ctx = new AudioContext();
  } catch (e) {}
}
// [주파수, 길이, 파형, 음량, 끝 주파수]
const SFX = {
  meok: [[520, 0.05, 'square', 0.05, 300]],
  hwa: [[300, 0.08, 'sawtooth', 0.05, 500]],
  boom: [[120, 0.18, 'sawtooth', 0.09, 40]],
  ilpil: [[900, 0.12, 'triangle', 0.08, 200]],
  hanseol: [
    [1200, 0.15, 'sine', 0.06, 1800],
    [1600, 0.15, 'sine', 0.04, 2400]
  ],
  gyeol: [
    [440, 0.1, 'sine', 0.06, 660],
    [660, 0.15, 'sine', 0.05, 880]
  ],
  hurt: [[160, 0.08, 'square', 0.06, 90]],
  kill: [[260, 0.05, 'square', 0.03, 130]],
  coin: [[1400, 0.05, 'square', 0.03, 1800]],
  pick: [[700, 0.06, 'triangle', 0.05, 1000]],
  rare: [
    [880, 0.08, 'triangle', 0.06, 880],
    [1320, 0.12, 'triangle', 0.06, 1320]
  ],
  legend: [
    [660, 0.1, 'triangle', 0.08, 660],
    [880, 0.1, 'triangle', 0.08, 880],
    [1320, 0.3, 'triangle', 0.08, 1320]
  ],
  lvl: [
    [523, 0.1, 'square', 0.05, 523],
    [659, 0.1, 'square', 0.05, 659],
    [784, 0.2, 'square', 0.05, 784]
  ],
  dodge: [[300, 0.08, 'sine', 0.04, 600]],
  slam: [[80, 0.3, 'sawtooth', 0.12, 30]],
  boss: [
    [200, 0.3, 'sawtooth', 0.1, 60],
    [400, 0.4, 'triangle', 0.08, 800]
  ],
  equip: [[600, 0.06, 'square', 0.04, 900]],
  forge: [
    [1000, 0.05, 'square', 0.05, 1000],
    [1500, 0.08, 'square', 0.04, 1500]
  ]
};
sfx = function (name) {
  const a = AU.ctx;
  if (!a || GS.mute || !SFX[name]) return;
  const now = a.currentTime;
  if (AU.last[name] && now - AU.last[name] < 0.05) return;
  AU.last[name] = now;
  let t = now;
  for (const [f, d, type, v, f2] of SFX[name]) {
    const o = a.createOscillator(),
      g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + d + 0.02);
    t += d * 0.8;
  }
};
/* ======================= 출정 흐름과 반복 ======================= */
function startRun(tier) {
  GS.tier = tier;
  GS.floor = 1;
  GS.runSeed = (Math.random() * 1e9) | 0;
  enterFloor(1);
}
function enterFloor(f) {
  const prev = GS.w;
  GS.floor = f;
  GS.w = startFloor(GS.ch, f, GS.tier, GS.runSeed + f);
  if (prev) (GS.w.p.hp = Math.min(GS.w.S.maxHp, prev.p.hp)), (GS.w.p.ki = prev.p.ki);
  R_.seen = new Set();
  GS.mode = 'dungeon';
  GS.modal = null;
  guardInput(0.3);
  showScr('none');
  persist();
  toast(`<b>백귀사 ${f}층</b>${f === FLOORS ? ' — 대장 도깨비가 기다린다' : ''}`);
}
function handleEvents(w) {
  const LAST = {clear: 1, won: 1, dead: 1};
  w.events.sort((a, b) => (LAST[a.k] || 0) - (LAST[b.k] || 0)); // 층 이동 전에 레벨 업 같은 알림을 먼저
  for (const ev of w.events) {
    if (ev.k === 'lvl') toast(`<b style="color:#ffd451">레벨 ${ev.lvl}!</b> 수련점 +1 (K)`);
    else if (ev.k === 'pick' && ev.item.rar >= 1) toast(`<span class="t${ev.item.rar}">${RAR_NAME[ev.item.rar]} ${esc(itemName(ev.item))}</span>${better(ev.item) ? ' <span style="color:#7fe07f">▲</span>' : ''}`);
    else if (ev.k === 'full') toast('가방이 가득 찼다 — 마을에서 팔거나 정리하자');
    else if (ev.k === 'bossStart') toast(`<b style="color:#ff7a6a">${BOSS.n}</b> — 바닥의 붉은 표시를 피하라 (회피)`);
    else if (ev.k === 'phase') toast(`<b style="color:#ff7a6a">${BOSS.n}가 분노했다</b>`);
    else if (ev.k === 'boss') toast('<b style="color:#ffd451">대장 도깨비를 물리쳤다!</b> 빛나는 문으로');
    else if (ev.k === 'clear') {
      w.events = [];
      return enterFloor(GS.floor + 1);
    } else if (ev.k === 'won') {
      const ch = GS.ch;
      const opened = GS.tier + 1 > ch.maxTier;
      ch.maxTier = Math.max(ch.maxTier, GS.tier + 1);
      GS.tierPick = ch.maxTier;
      persist();
      w.events = [];
      return msg('백귀사를 정화했다', `업 ${GS.tier}단계의 대장 도깨비를 물리쳤다.${opened ? `<br><b style="color:#ffd451">업 ${GS.tier + 1}단계가 열렸다.</b> 요괴가 더 세고 좋은 장비가 더 자주 나온다.` : ''}`, [{t: '퇴마청으로', pri: 1, fn: goTown}]);
    } else if (ev.k === 'dead') {
      const ch = GS.ch,
        lost = Math.floor(ch.gold * 0.1);
      ch.gold -= lost;
      persist();
      w.events = [];
      return msg('쓰러졌다', `요괴에게 쓰러졌다. 엽전 ${lost}닢을 잃었다.<br>장비와 레벨은 그대로다. 수련과 장비를 손보고 다시 출정하자.`, [{t: '퇴마청으로', pri: 1, fn: goTown}]);
    }
  }
  w.events = [];
}
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  const dt = Math.min(0.05, Math.max(0, t - (lastT || t)));
  lastT = t;
  // 느리면 절약 모드
  R_.ft.push(dt);
  if (R_.ft.length > 90) R_.ft.shift();
  if (R_.ft.length === 90 && !R_.lowFx && R_.ft.reduce((a, b) => a + b, 0) / 90 > 1 / 40) R_.lowFx = true;
  const c = R_.ctx;
  if (GS.mode === 'dungeon' && GS.w) {
    const w = GS.w;
    const inp = readInput();
    readMoveCache.mx = inp.mx;
    readMoveCache.my = inp.my;
    if (!GS.modal && !document.hidden) {
      // 고정 걸음(1/60)으로 나눠 계산: 느린 기기에서도 같은 규칙
      let left = dt;
      while (left > 1e-6) {
        const s = Math.min(1 / 60, left);
        update(w, s, inp);
        inp.dodge = false;
        left -= s;
      }
      handleEvents(w);
    }
    if (GS.w) {
      drawWorld(GS.w, t);
      drawHud(GS.w, t);
    }
  } else {
    // 마을·처음 화면 뒤: 등불 흔들리는 어둠
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#120c10';
    c.fillRect(0, 0, R_.cv.width, R_.cv.height);
  }
}
function boot() {
  R_.cv = $('cv');
  resize();
  addEventListener('resize', resize);
  bindInput(R_.cv);
  try {
    GS.mute = localStorage.getItem('baekgwisa-mute') === '1';
  } catch (e) {}
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && GS.mode === 'dungeon') {
      persist();
      if (!GS.modal) openPause();
    }
  });
  $('verTag').textContent = GAME_VER;
  showTitle();
  requestAnimationFrame(frame);
}
if (!globalThis.__NO_BOOT) boot();
</script>
